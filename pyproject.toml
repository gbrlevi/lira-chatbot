[project]
name = "emporio-da-musica-chatbot"
version = "0.1.0"
description = "PoC de agente de atendimento para a Empório da Música"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
lira = "app.interfaces.cli:main"
lira-ingest = "app.ingest.run:main"
lira-api = "app.interfaces.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
